[package]
name = "logship"
version = "0.1.0"
edition = "2024"
description = "A blazing fast, GPU-accelerated log file explorer built on GPUI"
license-file = "LICENSE"

[dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
memmap2 = "0.9"
memchr = "2"
rayon = "1"
regex = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
