name: Auto tag

# Every push to main is released as the next patch version: if the newest tag
# is v0.2.1, the push is tagged v0.2.2 and released.
#
# A tag pushed with the workflow's GITHUB_TOKEN doesn't trigger other
# workflows, so this calls release.yml itself instead of relying on its tag
# trigger. Pushing a tag by hand (for example a new minor or major version) still
# releases through release.yml as before. Put [skip ci] in a commit message to
# push to main without releasing.
#
# GitHub occasionally drops a push event, so no release starts. "Run workflow"
# on this workflow (Actions tab, branch main) then tags and releases main's
# latest commit the same way; it does nothing if that commit is already tagged.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, so two quick pushes can't compute the same tag.
concurrency:
  group: auto-tag
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    # "Run workflow" lets anyone with write access pick a branch; only main
    # is ever released.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: tag
        name: Tag the next patch version
        run: |
          if git tag --points-at "$GITHUB_SHA" | grep -q '^v'; then
            echo "$GITHUB_SHA is already tagged, nothing to do"
            exit 0
          fi
          next=$(packaging/next-version.sh)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" -m "Release $next" "$GITHUB_SHA"
          git push origin "$next"
          echo "Tagged $GITHUB_SHA as $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
